      <main>
        <section>
          <h2>About Dhruv Singh</h2>
          <p>Dhruv is pursuing a BEng in Computer Engineering (Software Option) at Toronto Metropolitan University (2023–2028). He currently works as a Co-op Program Assistant at the TMU Career, Co-op &amp; Student Success Centre.</p>
        </section>
        <section>
          <h2>Featured Engineering Projects</h2>
          <ul>
            <li><strong>Brainstormzz:</strong> AI-powered concept mapping and ideation whiteboard built with React, Node.js, and OpenAI API, delivering structured JSON schemas in &lt;1.2s.</li>
            <li><strong>Urban Carpool Matching System:</strong> Python geospatial ride-sharing matching engine processing 500+ simulated rider coordinates and calculating optimal pickup clusters.</li>
            <li><strong>Rover Arm Controller &amp; CV Test Automation:</strong> Robotics test framework using Python, OpenCV, and Arduino to automate precision verification across 6 servo joints with ARUCO tag visual feedback.</li>
            <li><strong>8-Bit General-Purpose Processor:</strong> Custom processor architecture designed in VHDL with ALU, multi-state control FSM, registers, and decoders validated on Intel Quartus and ModelSim.</li>
            <li><strong>Bookstore Application:</strong> Desktop retail management software implemented in Java Swing using State and Factory design patterns with persistent customer tiers.</li>
            <li><strong>Three-Stage MOSFET Voltage Amplifier:</strong> 180nm CMOS multi-stage analog amplifier designed and simulated in KiCad and ngspice achieving 42 dB voltage gain and &gt;1.8 MHz bandwidth.</li>
          </ul>
        </section>
        <section>
          <h2>Core Technical Stack &amp; Skills</h2>
          <p>Languages: Python, Java, C, C#, JavaScript, SQL, VHDL.</p>
          <p>Web &amp; Frameworks: React, Node.js, Express, HTML5, CSS3, Tailwind CSS, PostgreSQL, REST APIs.</p>
          <p>Hardware &amp; Tools: FPGA (Quartus &amp; ModelSim), Arduino, OpenCV, Git, GitHub, Jira, Excel (VLOOKUP &amp; Data Auditing).</p>
